services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: releaselens
      POSTGRES_PASSWORD: releaselens
      POSTGRES_DB: releaselens
    volumes: [pgdata:/var/lib/postgresql/data]
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://releaselens:releaselens@db:5432/releaselens
      CHROMA_PATH: /data/chroma
    volumes: [chroma:/data/chroma]
    depends_on: [db]
    ports: ["8000:8000"]
volumes:
  pgdata:
  chroma:
